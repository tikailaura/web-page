<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Rental - Your Movies</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Movie rental</h1>
</header>

<nav>
    <ul>
        <li><a href="home.html">Home</a></li>
        <li><a href="yourMovies.html" class="active">Your Movies</a></li>
        <li><a href="profile.html">Profile</a></li>
    </ul>
</nav>

<main class="container">

    <h2>Your Movies</h2>

    <table>

        <thead>
            <tr>
                <th>Movie</th>
                <th>Time Left</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>

            <tr>
                <td>Shrek</td>

                <td>
                    <div class="time-box">
                        <button class="time-button">&lt;</button>
                        <span class="time-value">12h</span>
                        <button class="time-button">&gt;</button>
                    </div>
                </td>

                <td>
                    <button class="remove-button">
                        Remove
                    </button>
                </td>
            </tr>

            <tr>
                <td>Titanic</td>

                <td>
                    <div class="time-box">
                        <button class="time-button">&lt;</button>
                        <span class="time-value">3d</span>
                        <button class="time-button">&gt;</button>
                    </div>
                </td>

                <td>
                    <button class="remove-button">
                        Remove
                    </button>
                </td>
            </tr>

            <tr>
                <td>Cars</td>

                <td>
                    <div class="time-box">
                        <button class="time-button">&lt;</button>
                        <span class="time-value">5h</span>
                        <button class="time-button">&gt;</button>
                    </div>
                </td>

                <td>
                    <button class="remove-button">
                        Remove
                    </button>
                </td>
            </tr>

            <tr>
                <td>Frozen</td>

                <td>
                    <div class="time-box">
                        <button class="time-button">&lt;</button>
                        <span class="time-value">1d</span>
                        <button class="time-button">&gt;</button>
                    </div>
                </td>

                <td>
                    <button class="remove-button">
                        Remove
                    </button>
                </td>
            </tr>

            <tr>
                <td>Harry Potter</td>

                <td>
                    <div class="time-box">
                        <button class="time-button">&lt;</button>
                        <span class="time-value">9h</span>
                        <button class="time-button">&gt;</button>
                    </div>
                </td>

                <td>
                    <button class="remove-button">
                        Remove
                    </button>
                </td>
            </tr>

        </tbody>

    </table>

</main>

<footer>
    <p>Made by: Laura Rogosa</p>
    <p>&copy; 2026</p>
</footer>

</body>
</html>
