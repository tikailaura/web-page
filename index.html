<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Rental - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Movie rental</h1>
</header>

<main class="login-wrapper">

    <!-- Sign In -->

    <section class="login-box">

        <form action="home.html">

            <label for="loginEmail">Email</label>
            <input
                type="email"
                id="loginEmail"
                placeholder="email"
                required>

            <label for="loginPassword">Password</label>
            <input
                type="password"
                id="loginPassword"
                placeholder="password"
                required>

            <button type="submit">
                Sign in
            </button>

        </form>

    </section>

    <!-- Register -->

    <section class="login-box">

        <form action="home.html">

            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                placeholder="name"
                required>

            <label for="surname">Surname</label>
            <input
                type="text"
                id="surname"
                placeholder="surname"
                required>

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="email"
                required>

            <label for="emailAgain">Email again</label>
            <input
                type="email"
                id="emailAgain"
                placeholder="email"
                required>

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="password"
                required>

            <label for="passwordAgain">Password again</label>
            <input
                type="password"
                id="passwordAgain"
                placeholder="password"
                required>

            <button type="submit">
                Register
            </button>

        </form>

    </section>

</main>

<footer>

    <p>Made by: Laura Rogosa</p>

    <p>&copy; 2026</p>

</footer>

</body>
</html>
